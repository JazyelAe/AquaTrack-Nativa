# Compila el APK en cada push a main y, al crear una etiqueta v*, publica un GitHub Release con el APK.
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle (valida el wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "AquaTrack-${GITHUB_REF_NAME}.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AquaTrack-apk
          path: AquaTrack-*.apk

      - name: Crear Release con el APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "AquaTrack-${GITHUB_REF_NAME}.apk" \
            --title "AquaTrack $GITHUB_REF_NAME" \
            --notes "APK de AquaTrack (app nativa Android, Kotlin + Jetpack Compose). Descarga el archivo .apk, ábrelo en tu teléfono Android 8.0 o superior y permite instalar apps de origen desconocido."
